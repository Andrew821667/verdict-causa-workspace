[project]
name = "causa-workspace"
version = "0.1.0"
description = "Auditable legal AI infrastructure with institutional packages, governance pipeline and formal consistency checks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Andrew Popov"}
]
dependencies = [
  "pydantic>=2.7",
  "networkx>=3.2",
  "z3-solver>=4.12",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # Точная версия, а не нижняя граница: 20.08.2026 CI ставил ruff>=0.5 заново
  # на каждом прогоне, подтянул 0.16.3, и его форматтер стал иначе оформлять
  # часть уже лежавших файлов (списковые включения, цепочки assert ... is
  # False) без единой правки кода — CI был красным неделю на этом одном. Та
  # же болезнь, из-за которой ниже зафиксирован select для ruff.lint; для
  # ruff.format единственная защита — точная версия.
  "ruff==0.16.4",
  "mypy>=1.10"
]
# Чтение PDF на стенде. Вынесено в дополнение намеренно: ядро от формата файла
# не зависит, а стенд без pypdf честно говорит, что PDF прочитать не может,
# вместо того чтобы показать пустой документ.
documents = [
  "pypdf>=4.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Явно фиксируем исторический набор правил проекта (E/F), при котором CI был
# зелёным. Иначе более новые версии ruff расширяют набор по умолчанию и начинают
# отмечать давно существующие файлы, не относящиеся к текущему релизу.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
